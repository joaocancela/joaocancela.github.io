<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="João Cancela is a political scientist at NOVA FCSH working on political behaviour, participation, elections, and democracy.">
    <meta name="theme-color" content="#153f3b">
    <title>{% if page.title %}{{ page.title }} · {% endif %}João Cancela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell nav-wrap">
        <a class="site-name" href="{{ '/' | relative_url }}" aria-label="João Cancela, home"><span>João Cancela</span><small>Political Scientist</small></a>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>About</a>
          <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research' %}aria-current="page"{% endif %}>Research</a>
          <a href="{{ '/teaching/' | relative_url }}" {% if page.url contains '/teaching' %}aria-current="page"{% endif %}>Teaching</a>
          <a href="{{ '/pdf/CV_JoaoCancela.pdf' | relative_url }}">CV <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main id="main-content" class="shell page-content">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-grid">
        <div><strong>João Cancela</strong><p>Political Science · NOVA FCSH · Lisbon</p></div>
        <div class="footer-links">
          <a href="mailto:joaocancela@fcsh.unl.pt">Email</a>
          <a href="https://scholar.google.com/citations?user=3uFaAyQAAAAJ&hl=en">Google Scholar</a>
          <a href="https://orcid.org/0000-0002-5055-2060">ORCID</a>
        </div>
      </div>
    </footer>
  </body>
</html>
